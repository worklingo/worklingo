        .lang-btn { padding: 20px; border: 2px solid #dee2e6; background: white; border-radius: 12px; cursor: pointer; transition: all 0.3s; font-size: 1.1em; text-align: center; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .lang-btn:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); border-color: #667eea; }

        .audio-btn:hover { background: #5568d3; transform: scale(1.1); }
        .word-hint { position: relative; color: #667eea; font-weight: 600; cursor: help; padding: 2px 4px; border-radius: 3px; display: inline-block; }
        .word-hint:hover { background: #f0f0f0; }
        .word-hint::after { content: attr(data-translation); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.9); color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.9em; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.3s; margin-bottom: 5px; z-index: 1000; }
        .word-hint:hover::after { opacity: 1; }
        .exercise-section { background: #f8f9fa; border-radius: 12px; padding: 25px; margin-bottom: 25px; }
        .exercise-section h3 { color: #495057; margin-bottom: 20px; }
        .exercise-question { font-size: 1.2em; margin-bottom: 15px; color: #212529; display: flex; align-items: center; gap: 10px; }

        .exercise-btn.incorrect { background: #dc3545; color: white; border-color: #dc3545; }

        .match-btn { padding: 15px; border: 2px solid #dee2e6; background: white; border-radius: 8px; cursor: pointer; transition: all 0.3s; min-height: 60px; text-align: left; }
        .match-btn:hover { background: #f8f9fa; }
        .match-btn.selected { background: #667eea; color: white; border-color: #667eea; }
        .match-btn.matched { background: #28a745; color: white; border-color: #28a745; pointer-events: none; }
        .sentence-with-blank { font-size: 1.3em; margin-bottom: 20px; text-align: center; color: #212529; line-height: 1.8; }
        .word-pool { display: flex; flex-wrap: wrap; gap: 10px; padding: 20px; background: #e9ecef; border-radius: 8px; min-height: 100px; margin: 20px 0; }

function speak(txt, lang) {
    if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        const langMap = {se:'sv-SE',no:'nb-NO',da:'da-DK',de:'de-DE',nl:'nl-NL',en:'en-US'};
        u.lang = langMap[lang] || 'sv-SE';
        u.rate = 0.9;
        speechSynthesis.speak(u);
    }
}

    s.ui = c;
    upTxt();
    const tl = [{c:'se',f:'🇸🇪',n:'Svenska'},{c:'no',f:'🇳🇴',n:'Norsk'},{c:'da',f:'🇩🇰',n:'Dansk'},{c:'de',f:'🇩🇪',n:'Deutsch'},{c:'nl',f:'🇳🇱',n:'Nederlands'},{c:'en',f:'🇬🇧',n:'English'}];
    document.getElementById('targetLanguageGrid').innerHTML = tl.map(l => 
        `<button class="lang-btn" onclick="selTgt('${l.c}')"><div class="flag">${l.f}</div><div>${l.n}</div></button>`
    ).join('');
    goTo(2);
}

function selTgt(c) {
    s.tgt = c;
    const tx = t[s.ui];
    document.getElementById('industrySelect').innerHTML = `<option value="">${tx.selectIndustry}</option>` +
        ['healthcare','construction','hospitality','manufacturing','retail','logistics'].map(i => 
            `<option value="${i}">${tx[i]}</option>`
        ).join('');
    goTo(3);
}

function selectIndustry() {
    s.ind = document.getElementById('industrySelect').value;
    if (s.ind) {
        const tx = t[s.ui];
        document.getElementById('levelGrid').innerHTML = ['novice','beginner','intermediate','advanced'].map(l => 
            `<button class="level-btn" onclick="selLvl('${l}')">${tx[l]}</button>`
        ).join('');
        goTo(4);
    }
}

function selLvl(l) {
    s.lvl = l;
    s.ph = db[s.ind] && db[s.ind][s.lvl] ? db[s.ind][s.lvl] : [];
    s.currentEx = 0; // Start at exercise 0
    showCurrentExercise();
}

function showCurrentExercise() {
    const tx = t[s.ui];
    
    // Always show phrases at top
    document.getElementById('phrasesSection').innerHTML = s.ph.map(p => {
        const tgt = p[s.tgt] || p.se || '';
        const nat = p[s.ui] || '';
        const words = tgt.split(' ');
        const hints = words.map(w => `<span class="word-hint" data-translation="${nat}">${w}</span>`).join(' ');
        return `<div class="phrase-item"><div class="phrase-content"><div class="phrase-target">${hints}</div><div class="phrase-native">${nat}</div></div><button class="audio-btn" onclick="speak('${tgt.replace(/'/g,"\\'")}','${s.tgt}')">🔊</button></div>`;
    }).join('');
    
    let exHtml = '';
    let maxEx = 3; // 0=Ex1, 1=Ex2, 2=Ex3, 3=Ex4
    
    // Show only current exercise
    if (s.ph.length > 0) {
        if (s.currentEx === 0) exHtml = renderEx1();
        else if (s.currentEx === 1) exHtml = renderEx2();
        else if (s.currentEx === 2) exHtml = renderEx3();
        else if (s.currentEx === 3) {
            const hasLong = s.ph.some(p => (p[s.tgt] || p.se || '').split(' ').length >= 3);
            if (hasLong) {
                exHtml = renderEx4();
            } else {
                // Skip Ex4 if no long phrases, go to finish
                maxEx = 2;
                s.currentEx = 3; // Set to max to show finish
            }
        }
    }
    
    // Navigation button
    const isLastEx = (s.currentEx >= maxEx);
    const navHtml = `
        <div style="display: flex; gap: 15px; margin-top: 30px;">
            <button class="check-btn" onclick="nextExercise()" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">
                ${isLastEx ? (tx.finish || 'Finish') : (tx.next || 'Next') + ' →'}
            </button>
        </div>
    `;
    
    document.getElementById('exercisesSection').innerHTML = exHtml + navHtml;
    document.getElementById('phrasesTitle').textContent = tx.phrases;
    goTo(5);
}

function nextExercise() {
    const maxEx = s.ph.some(p => (p[s.tgt] || p.se || '').split(' ').length >= 3) ? 3 : 2;
    
    if (s.currentEx < maxEx) {
        s.currentEx++;
        showCurrentExercise();
    } else {
        // Finished all exercises, go back to level selection
        const tx = t[s.ui];
        alert('🎉 ' + (tx.exercisesComplete || 'Great job! Choose next level when ready.'));
        goTo(4);
    }
}

function renderEx1() {
    const tx = t[s.ui];
    const p = s.ph[Math.floor(Math.random() * s.ph.length)];
    const cor = p[s.tgt] || p.se || '';
    const nat = p[s.ui] || '';
    const opts = [cor];
    while (opts.length < 4 && s.ph.length >= 4) {
        const r = s.ph[Math.floor(Math.random() * s.ph.length)];
        const o = r[s.tgt] || r.se || '';
        if (!opts.includes(o) && o !== cor) opts.push(o);
    }
    opts.sort(() => Math.random() - 0.5);
    return `<div class="exercise-section"><h3>${tx.ex1}</h3><div class="exercise-question">${nat}<button class="audio-btn" onclick="speak('${cor.replace(/'/g,"\\'")}','${s.tgt}')" style="margin-left:10px">🔊</button></div><div class="exercise-buttons">${opts.map(o => 
        `<button class="exercise-btn" onclick="chk1(this,'${cor.replace(/'/g,"\\'")}','${o.replace(/'/g,"\\'")}')">${o}</button>`
    ).join('')}</div><div id="fb1"></div></div>`;
}

function renderEx2() {
    const tx = t[s.ui];
    const sel = s.ph.slice(0, Math.min(4, s.ph.length));
    const left = sel.map(p => p[s.tgt] || p.se || '');
    const right = sel.map(p => p[s.ui] || '').sort(() => Math.random() - 0.5);
    return `<div class="exercise-section"><h3>${tx.ex2}</h3><div class="match-container"><div class="match-column">${left.map((w,i) => 
        `<button class="match-btn" onclick="selM('l',${i},'${w.replace(/'/g,"\\'")}')" data-w="${w}">${w}</button>`
    ).join('')}</div><div class="match-column">${right.map((w,i) => 
        `<button class="match-btn" onclick="selM('r',${i},'${w.replace(/'/g,"\\'")}')" data-w="${w}">${w}</button>`
    ).join('')}</div></div><div id="fb2"></div></div>`;
}

function renderEx3() {
    const tx = t[s.ui];
    const p = s.ph[Math.floor(Math.random() * s.ph.length)];
    const sent = p[s.tgt] || p.se || '';
    const words = sent.split(' ');
    if (words.length < 2) return '';
    const bi = Math.floor(Math.random() * words.length);
    const cor = words[bi];
    const blank = words.map((w,i) => i === bi ? '_____' : w).join(' ');
    const opts = [cor];
    const oth = s.ph.filter(x => x !== p);
    for (let i = 0; i < 3 && i < oth.length && opts.length < 4; i++) {
        const ow = (oth[i][s.tgt] || oth[i].se || '').split(' ').filter(w => w.length > 2);
        if (ow.length > 0) {
            const candidate = ow[Math.floor(Math.random() * ow.length)];
            if (!opts.includes(candidate)) opts.push(candidate);
        }
    }
    const uniq = [...new Set(opts)].slice(0, 4).sort(() => Math.random() - 0.5);
    if (uniq.length < 2) return '';
    return `<div class="exercise-section"><h3>${tx.ex3}</h3><div class="sentence-with-blank">${blank}</div><div class="exercise-buttons">${uniq.map(o => 
        `<button class="exercise-btn" onclick="chk3(this,'${cor.replace(/'/g,"\\'")}','${o.replace(/'/g,"\\'")}')">${o}</button>`
    ).join('')}</div><div id="fb3"></div></div>`;
}

function renderEx4() {
    const tx = t[s.ui];
    const longPhrases = s.ph.filter(p => (p[s.tgt] || p.se || '').split(' ').length >= 3);
    if (longPhrases.length === 0) return '';
    const p = longPhrases[Math.floor(Math.random() * longPhrases.length)];
    const sent = p[s.tgt] || p.se || '';
    const words = sent.split(' ').sort(() => Math.random() - 0.5);
    return `<div class="exercise-section"><h3>${tx.ex4}</h3><div class="word-pool" id="pool">${words.map(w => 
        `<span class="word-chip" onclick="toB(this)">${w}</span>`
    ).join('')}</div><div class="sentence-builder" id="build"></div><button class="check-btn" onclick="chk4('${sent.replace(/'/g,"\\'")}')"> ${tx.check}</button><div id="fb4"></div></div>`;
}

function chk1(b,c,sel) {
    const tx = t[s.ui];
    const btns = b.parentElement.querySelectorAll('.exercise-btn');
    btns.forEach(x => x.disabled = true);
    const fb = document.getElementById('fb1');
    if (sel === c) {
        b.classList.add('correct');
        fb.className = 'feedback correct';
        fb.textContent = tx.correct;
    } else {
        b.classList.add('incorrect');
        btns.forEach(x => { if (x.textContent.trim() === c) x.classList.add('correct'); });
        fb.className = 'feedback incorrect';
        fb.textContent = tx.incorrect;
    }
}

function selM(side,i,w) {
    const btns = document.querySelectorAll('.match-btn');
    const btn = Array.from(btns).find(b => b.dataset.w === w);
    if (btn.classList.contains('matched')) return;
    if (side === 'l') {
        if (s.sl) s.sl.classList.remove('selected');
        s.sl = btn;
        btn.classList.add('selected');
    } else {
        if (s.sr) s.sr.classList.remove('selected');
        s.sr = btn;
        btn.classList.add('selected');
    }
    if (s.sl && s.sr) {
        const lw = s.sl.dataset.w;
        const rw = s.sr.dataset.w;
        const p = s.ph.find(x => (x[s.tgt] === lw || x.se === lw) && x[s.ui] === rw);
        const tx = t[s.ui];
        const fb = document.getElementById('fb2');
        if (p) {
            s.sl.classList.add('matched');
            s.sr.classList.add('matched');
            s.sl.classList.remove('selected');
            s.sr.classList.remove('selected');
            fb.className = 'feedback correct';
            fb.textContent = tx.correct;
            setTimeout(() => fb.textContent = '', 1500);
        } else {
            fb.className = 'feedback incorrect';
            fb.textContent = tx.incorrect;
            setTimeout(() => {
                s.sl.classList.remove('selected');
                s.sr.classList.remove('selected');
                fb.textContent = '';
            }, 1500);
        }
        s.sl = null;
        s.sr = null;
    }
}

function chk3(b,c,sel) {
    const tx = t[s.ui];
    const btns = b.parentElement.querySelectorAll('.exercise-btn');
    btns.forEach(x => x.disabled = true);
    const fb = document.getElementById('fb3');
    if (sel === c) {
        b.classList.add('correct');
        fb.className = 'feedback correct';
        fb.textContent = tx.correct;
    } else {
        b.classList.add('incorrect');
        btns.forEach(x => { if (x.textContent.trim() === c) x.classList.add('correct'); });
        fb.className = 'feedback incorrect';
        fb.textContent = tx.incorrect;
    }
}

function toB(c) {
    document.getElementById('build').appendChild(c);
    c.onclick = function() { toP(this); };
}

function toP(c) {
    document.getElementById('pool').appendChild(c);
    c.onclick = function() { toB(this); };
}

function chk4(c) {
    const tx = t[s.ui];
    const chips = Array.from(document.getElementById('build').children);
    const built = chips.map(x => x.textContent.trim()).join(' ');
    const fb = document.getElementById('fb4');
    if (built === c) {
        fb.className = 'feedback correct';
        fb.textContent = tx.correct;
        chips.forEach(x => x.style.border = '2px solid #28a745');
    } else {
        fb.className = 'feedback incorrect';
        fb.textContent = tx.incorrect;
    }
}

function goTo(n) {
    document.querySelectorAll('.step-container').forEach(x => x.classList.remove('active'));
    document.getElementById('step' + n).classList.add('active');
}

function upTxt() {
    const tx = t[s.ui];
    document.getElementById('step1Title').textContent = tx.chooseNative;
    document.getElementById('step2Title').textContent = tx.chooseTarget;
    document.getElementById('step3Title').textContent = tx.chooseIndustry;
    document.getElementById('step4Title').textContent = tx.chooseLevel;
    ['backBtn2','backBtn3','backBtn4','backBtn5'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = `← ${tx.back}`;
    });
}

init();
    </script>
</body>
</html>
