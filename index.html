            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #667eea;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: none;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 100;
        }
        .back-button:hover { background: #5568d3; transform: scale(1.1); }
        .back-button.visible { display: flex; }
        .header { text-align: center; margin-bottom: 30px; margin-top: 30px; }
        .logo {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .subtitle { color: #666; font-size: 14px; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .section-title {
            font-size: 22px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            padding: 16px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            text-align: center;
        }
        .option-btn:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-2px);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }
        .error-message {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
            width: 0%;
        }
        .points-display {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }
        .sentence-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .sentence-text {
            font-size: 18px;
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .word-hover {
            position: relative;
            display: inline-block;
            cursor: help;
            color: #667eea;
            font-weight: 500;
            border-bottom: 2px dotted #667eea;
        }
        .translation-bubble {
            visibility: hidden;
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            white-space: nowrap;
            margin-bottom: 5px;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }
        .word-hover:hover .translation-bubble {
            visibility: visible;
            opacity: 1;
        }
        .audio-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        .audio-btn:hover { background: #218838; }
        .exercise-card {
            background: #f8f9ff;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }
        .exercise-title {
            font-size: 18px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 15px;
        }
        .match-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .match-item {
            padding: 12px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }
        .match-item.left-column {
            grid-column: 1;
        }
        .match-item.right-column {
            grid-column: 2;
        }
        .match-item:hover { border-color: #667eea; }
        .match-item.selected { border-color: #667eea; background: #e7e9fc; }
        .match-item.correct { border-color: #28a745; background: #d4edda; cursor: default; }
        .match-item.wrong { border-color: #dc3545; background: #f8d7da; animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .word-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        .word-option {
            padding: 12px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            position: relative;
        }
        .word-option:hover .translation-bubble {
            visibility: visible;
            opacity: 1;
        }
        .word-option:hover { border-color: #667eea; }
        .word-option.correct { border-color: #28a745; background: #d4edda; }
        .word-option.wrong { border-color: #dc3545; background: #f8d7da; }
        .sentence-with-blank {
            font-size: 18px;
            margin-bottom: 15px;
            line-height: 1.8;
        }
        .blank {
            display: inline-block;
            min-width: 80px;
            padding: 0 10px;
            border-bottom: 2px solid #667eea;
            color: #667eea;
            font-weight: bold;
        }
        .action-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            width: 100%;
            margin-top: 20px;
            transition: all 0.3s;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
    </style>

        function generateLesson() {
            const lessonContent = document.getElementById('lessonContent');
            const t = translations[state.uiLanguage] || translations.en;

            if (!state.phrasesData || !state.phrasesData[state.targetLanguage]) {
                lessonContent.innerHTML = `<div class="error-message">ERROR: No phrases for this language.</div>`;
                return;
            }

            const targetPhrases = state.phrasesData[state.targetLanguage];
            
            // FIX 1: Get UI language translations
            let uiPhrases;
            if (UI_TRANSLATIONS[state.uiLanguage]) {
                console.log(`✅ Using UI_TRANSLATIONS for ${state.uiLanguage}`);
                uiPhrases = UI_TRANSLATIONS[state.uiLanguage];
            } else if (state.phrasesData[state.uiLanguage]) {
                console.log(`✅ Using phrasesData for ${state.uiLanguage}`);
                uiPhrases = state.phrasesData[state.uiLanguage];
            } else {
                console.log(`⚠️ No translations for ${state.uiLanguage}, using English fallback`);
                uiPhrases = state.phrasesData.gb || targetPhrases;
            }

            // Select 5 random phrases
            const selectedIndices = [];
            const availableIndices = targetPhrases.map((_, i) => i).filter(i => !state.usedPhraseIndices.has(i) && targetPhrases[i]);
            
            if (availableIndices.length < 5) {
                state.usedPhraseIndices.clear();
            }
            
            while (selectedIndices.length < 5 && selectedIndices.length < targetPhrases.length) {
                const availablePool = targetPhrases.map((_, i) => i).filter(i => 
                    !state.usedPhraseIndices.has(i) && !selectedIndices.includes(i) && targetPhrases[i]
                );
                if (availablePool.length === 0) break;
                const rand = availablePool[Math.floor(Math.random() * availablePool.length)];
                selectedIndices.push(rand);
                state.usedPhraseIndices.add(rand);
            }

            console.log("✅ Selected phrase indices:", selectedIndices);

            state.lessonData = {
                sentences: selectedIndices.map(i => {
                    const targetPhrase = targetPhrases[i];
                    // FIX: Get correct UI translation
                    let uiTranslation = targetPhrase; // fallback
                    
                    if (typeof uiPhrases === 'object' && uiPhrases[targetPhrase]) {
                        uiTranslation = uiPhrases[targetPhrase];
                    } else if (Array.isArray(uiPhrases) && uiPhrases[i]) {
                        uiTranslation = uiPhrases[i];
                    }
                    
                    return {
                        text: targetPhrase,
                        translation: uiTranslation,
                        words: extractWords(targetPhrase, uiTranslation)
                    };
                }),
                matchPairs: createMatchPairs(selectedIndices, targetPhrases, uiPhrases),
                fillBlanks: createFillBlanks(selectedIndices, targetPhrases, uiPhrases)
            };

            console.log("✅ Lesson data generated:", state.lessonData);
            renderLesson();
        }

        function extractWords(targetPhrase, uiPhrase) {
            const words = targetPhrase.split(' ');
            
            // For single words, direct translation
            if (words.length === 1) {
                return [{
                    word: words[0].replace(/[.,!?]/g, ''),
                    translation: uiPhrase.replace(/[.,!?]/g, '')
                }];
            }
            
            // For phrases, each target word shows complete UI phrase
            return words.map(w => ({
                word: w.replace(/[.,!?]/g, ''),
                translation: uiPhrase
            }));
        }

        function createMatchPairs(indices, targetPhrases, uiPhrases) {
            // FIX 2: Target language LEFT, UI language RIGHT
            const pairs = [];
            
            indices.forEach(i => {
                const targetPhrase = targetPhrases[i];
                let uiPhrase = targetPhrase;
                
                if (typeof uiPhrases === 'object' && uiPhrases[targetPhrase]) {
                    uiPhrase = uiPhrases[targetPhrase];
                } else if (Array.isArray(uiPhrases) && uiPhrases[i]) {
                    uiPhrase = uiPhrases[i];
                }
                
                if (targetPhrase.split(' ').length === 1) {
                    pairs.push({
                        target: targetPhrase.replace(/[.,!?]/g, ''),
                        ui: uiPhrase.replace(/[.,!?]/g, '')
                    });
                } else {
                    const targetWords = targetPhrase.split(' ').filter(w => w.length > 3);
                    const uiWords = uiPhrase.split(' ').filter(w => w.length > 3);
                    if (targetWords.length > 0 && uiWords.length > 0) {
                        pairs.push({
                            target: targetWords[0].replace(/[.,!?]/g, ''),
                            ui: uiWords[0].replace(/[.,!?]/g, '')
                        });
                    }
                }
            });
            
            console.log("✅ Match pairs created:", pairs);
            return pairs.slice(0, 8);
        }

        function createFillBlanks(indices, targetPhrases, uiPhrases) {
            // FIX 3: Use words from OTHER sentences as wrong options
            return indices.slice(0, 5).map((currentIndex, exerciseNum) => {
                const targetPhrase = targetPhrases[currentIndex];
                const words = targetPhrase.split(' ').filter(w => w.length > 3);
                
                if (targetPhrase.split(' ').length === 1 || words.length === 0) {
                    return null;
                }
                
                const correctWord = words[Math.floor(Math.random() * words.length)].replace(/[.,!?]/g, '');
                
                // Get words from OTHER sentences
                const otherIndices = indices.filter((idx, i) => i !== exerciseNum);
                const wrongWords = [];
                
                otherIndices.forEach(idx => {
                    const otherPhrase = targetPhrases[idx];
                    const otherWords = otherPhrase.split(' ')
                        .map(w => w.replace(/[.,!?]/g, ''))
                        .filter(w => w.length > 3 && w !== correctWord);
                    wrongWords.push(...otherWords);
                });
                
                if (wrongWords.length < 3) {
                    const fillers = ['och', 'men', 'för', 'att', 'den', 'det', 'med', 'till', 'som', 'är', 'har', 'kan', 'ska', 'var'];
                    wrongWords.push(...fillers.filter(w => w !== correctWord.toLowerCase()));
                }
                
                const uniqueWrong = [...new Set(wrongWords)]
                    .sort(() => Math.random() - 0.5)
                    .slice(0, 3);
                
                if (uniqueWrong.length < 3) return null;
                
                const options = [correctWord, ...uniqueWrong].sort(() => Math.random() - 0.5);
                const sentence = targetPhrase.replace(new RegExp('\\b' + correctWord + '\\b', 'i'), '___');
                
                // Get UI translations for all options
                const optionsWithTranslations = options.map(opt => {
                    let translation = opt;
                    if (typeof uiPhrases === 'object' && uiPhrases[opt]) {
                        translation = uiPhrases[opt];
                    }
                    return { word: opt, translation };
                });
                
                return {sentence, correctWord, options: optionsWithTranslations};
            }).filter(fb => fb !== null);
        }

        function renderMatchExercise() {
            const container = document.getElementById('matchContainer');
            const pairs = state.lessonData.matchPairs;
            
            // FIX: Target language LEFT column, UI language RIGHT column
            const leftColumn = pairs.map(p => ({text: p.target, type: 'target', match: p.ui, side: 'left'}));
            const rightColumn = pairs.map(p => ({text: p.ui, type: 'ui', match: p.target, side: 'right'}));
            
            leftColumn.sort(() => Math.random() - 0.5);
            rightColumn.sort(() => Math.random() - 0.5);
            
            let html = '';
            
            // Add left column items
            leftColumn.forEach(item => {
                html += `<div class="match-item left-column" data-text="${item.text}" data-match="${item.match}" data-side="left" onclick="selectMatch(this)">${item.text}</div>`;
            });
            
            // Add right column items
            rightColumn.forEach(item => {
                html += `<div class="match-item right-column" data-text="${item.text}" data-match="${item.match}" data-side="right" onclick="selectMatch(this)">${item.text}</div>`;
            });
            
            container.innerHTML = html;
            console.log("✅ Match exercise rendered: Target LEFT, UI RIGHT");
        }

        let selectedMatch = [];

        function selectMatch(element) {
            if (element.classList.contains('correct') || element.classList.contains('wrong')) return;
            
            if (selectedMatch.length === 2) {
                selectedMatch.forEach(el => el.classList.remove('selected'));
                selectedMatch = [];
            }
            
            element.classList.toggle('selected');
            
            if (element.classList.contains('selected')) {
                selectedMatch.push(element);
            } else {
                selectedMatch = selectedMatch.filter(el => el !== element);
            }
            
            document.getElementById('checkMatchBtn').disabled = selectedMatch.length !== 2;
        }

        function checkMatch() {
            if (selectedMatch.length !== 2) return;
            
            const [first, second] = selectedMatch;
            
            // Must select one from each side
            const firstSide = first.dataset.side;
            const secondSide = second.dataset.side;
            
            if (firstSide === secondSide) {
                // Same side selected - wrong
                first.classList.add('wrong');
                second.classList.add('wrong');
                setTimeout(() => {
                    first.classList.remove('wrong', 'selected');
                    second.classList.remove('wrong', 'selected');
                }, 1000);
                selectedMatch = [];
                document.getElementById('checkMatchBtn').disabled = true;
                return;
            }
            
            const isCorrect = first.dataset.match === second.dataset.text && second.dataset.match === first.dataset.text;
            
            if (isCorrect) {
                first.classList.add('correct');
                second.classList.add('correct');
                first.classList.remove('selected');
                second.classList.remove('selected');
                addPoints(10);
                console.log("✅ Correct match!");
            } else {
                first.classList.add('wrong');
                second.classList.add('wrong');
                setTimeout(() => {
                    first.classList.remove('wrong', 'selected');
                    second.classList.remove('wrong', 'selected');
                }, 1000);
            }
            
            selectedMatch = [];
            document.getElementById('checkMatchBtn').disabled = true;
        }

        function selectFillBlank(index, selected, correct) {
            const options = document.querySelectorAll(`#options${index} .word-option`);
            const blank = document.getElementById(`blank${index}`);
            
            options.forEach(opt => {
                opt.classList.remove('selected', 'correct', 'wrong');
                opt.style.pointerEvents = 'none';
            });
            
            event.target.classList.add('selected');
            
            if (selected === correct) {
                event.target.classList.add('correct');
                blank.textContent = selected;
                blank.style.color = '#4caf50';
                addPoints(10);
                console.log("✅ Correct fill-in-the-blank!");

                event.target.classList.add('wrong');
                setTimeout(() => {
                    options.forEach(opt => {
                        opt.classList.remove('selected', 'wrong');
                        opt.style.pointerEvents = 'auto';
                    });
                }, 1000);
            }
        }
