        .flag { font-size: 1.5em; }
        .industry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 30px 0; }
        .industry-button { background: white; border: 3px solid #667eea; padding: 30px 20px; border-radius: 15px; font-size: 1.1em; cursor: pointer; transition: all 0.3s ease; text-align: center; }
        .industry-button:hover { background: #667eea; color: white; transform: translateY(-5px); }
        .level-tabs { display: flex; gap: 10px; margin: 30px 0; justify-content: center; flex-wrap: wrap; }
        .level-tab { background: #f0f0f0; border: none; padding: 15px 25px; border-radius: 25px; font-size: 0.95em; cursor: pointer; transition: all 0.3s ease; }
        .level-tab.active { background: #667eea; color: white; }
        .exercise-tabs { display: flex; gap: 10px; margin: 20px 0; justify-content: center; flex-wrap: wrap; }
        .exercise-tab { background: #f0f0f0; border: none; padding: 12px 20px; border-radius: 25px; cursor: pointer; transition: all 0.3s ease; font-size: 0.9em; }
        .exercise-tab.active { background: #667eea; color: white; }
        .exercise-container { background: #f9f9f9; padding: 30px; border-radius: 15px; margin: 20px 0; min-height: 300px; }
        .phrase-item { background: white; padding: 20px; margin: 15px 0; border-radius: 10px; border-left: 5px solid #667eea; }
        .phrase-text { font-size: 1.2em; color: #333; line-height: 1.8; margin-bottom: 10px; }
        .audio-button { background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.9em; transition: all 0.3s ease; }
        .audio-button:hover { background: #218838; }
        .pairing-container { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin: 20px 0; }
        .pairing-column h3 { text-align: center; color: #667eea; margin-bottom: 15px; font-size: 1.1em; }
        .pair-item { background: white; padding: 15px; margin: 10px 0; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; border: 2px solid #ddd; text-align: center; }
        .pair-item:hover { border-color: #667eea; transform: translateX(5px); }
        .pair-item.selected { background: #667eea; color: white; border-color: #667eea; }
        .pair-item.correct { background: #28a745; color: white; border-color: #28a745; }
        .fillblank-sentence { font-size: 1.3em; line-height: 2.2; margin: 25px 0; text-align: center; }
        .blank-input { display: inline-block; min-width: 150px; border: none; border-bottom: 3px solid #667eea; padding: 5px 10px; font-size: 1em; text-align: center; background: #f0f0f0; border-radius: 5px; margin: 0 5px; }
        .blank-input:focus { outline: none; background: #e3f2fd; }
        .back-button { background: #6c757d; color: white; border: none; padding: 12px 25px; border-radius: 25px; font-size: 1em; cursor: pointer; margin-top: 20px; transition: all 0.3s ease; }
        .back-button:hover { background: #5a6268; }
        .check-button { background: #28a745; color: white; border: none; padding: 15px 40px; border-radius: 25px; font-size: 1.1em; cursor: pointer; margin: 20px auto; display: block; transition: all 0.3s ease; }
        .check-button:hover { background: #218838; transform: scale(1.05); }
        .next-button { background: #007bff; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-size: 1em; cursor: pointer; margin: 20px 10px; transition: all 0.3s ease; }
        .next-button:hover { background: #0056b3; }

        // App state
        let state = {
            uiLang: null,
            targetLang: null,
            industry: null,
            level: 'novice',
            exercise: 1,
            pairingSelected: { left: null, right: null },
            pairingCorrect: [],
            pairingData: null
        };

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function selectUILanguage(lang) {
            console.log('✅ UI Language:', lang);
            state.uiLang = lang;
            updateUIText();
            showScreen('screen-target-lang');
        }

        function selectTargetLanguage(lang) {
            console.log('✅ Target Language:', lang);
            state.targetLang = lang;
            showScreen('screen-industry');
        }

        function selectIndustry(industry) {
            console.log('✅ Industry:', industry);
            state.industry = industry;
            document.getElementById('current-industry-name').textContent = DATA.ui[state.uiLang][industry];
            showScreen('screen-exercises');
            loadExercise();
        }

        function selectLevel(level) {
            state.level = level;
            document.querySelectorAll('.level-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            loadExercise();
        }

        function selectExercise(num) {
            state.exercise = num;
            document.querySelectorAll('.exercise-tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');
            loadExercise();
        }

        function nextExercise() {
            if (state.exercise < 3) {
                selectExercise(state.exercise + 1);
                document.querySelectorAll('.exercise-tab')[state.exercise - 1].click();
            } else {
                alert(DATA.ui[state.uiLang].correct + ' All exercises completed!');
            }
        }

        function updateUIText() {
            const ui = DATA.ui[state.uiLang];
            document.getElementById('heading-ui-select').textContent = ui.selectNativeLanguage;
            document.getElementById('text-selectTargetLanguage').textContent = ui.selectTargetLanguage;
            document.getElementById('text-selectIndustry').textContent = ui.selectIndustry;
            document.getElementById('text-industry-healthcare').textContent = ui.healthcare;
            document.getElementById('text-industry-construction').textContent = ui.construction;
            document.getElementById('text-industry-hospitality').textContent = ui.hospitality;
            document.getElementById('text-industry-manufacturing').textContent = ui.manufacturing;
            document.getElementById('text-industry-logistics').textContent = ui.logistics;
            document.getElementById('text-level-novice').textContent = ui.novice;
            document.getElementById('text-level-beginner').textContent = ui.beginner;
            document.getElementById('text-level-advanced').textContent = ui.advanced;
            document.getElementById('text-exercise1').textContent = '📖 ' + ui.exercise1;
            document.getElementById('text-exercise2').textContent = '🔗 ' + ui.exercise2;
            document.getElementById('text-exercise3').textContent = '✏️ ' + ui.exercise3;
            document.querySelectorAll('[id^="text-back"]').forEach(btn => btn.textContent = '← ' + ui.back);
            document.getElementById('text-next').textContent = ui.next + ' →';
        }

        function loadExercise() {
            const phrases = DATA.database[state.industry]?.[state.level] || [];
            if (phrases.length === 0) {
                document.getElementById('exercise-content').innerHTML = '<p style="text-align: center; padding: 40px; color: #999;">No phrases available.</p>';
                return;
            }
            state.pairingSelected = { left: null, right: null };
            state.pairingCorrect = [];
            if (state.exercise === 1) renderExercise1(phrases);
            else if (state.exercise === 2) renderExercise2(phrases);
            else if (state.exercise === 3) renderExercise3(phrases);
        }

        function renderExercise1(phrases) {
            let html = '<div class="exercise-container">';
            phrases.slice(0, 10).forEach(phrase => {
                const text = phrase[state.targetLang] || phrase.se || 'N/A';
                html += `<div class="phrase-item"><div class="phrase-text">${text}</div><button class="audio-button" onclick="playAudio('${phrase.id}')">🔊 ${DATA.ui[state.uiLang].listen}</button></div>`;
            });
            document.getElementById('exercise-content').innerHTML = html + '</div>';
        }

        function renderExercise2(phrases) {
            const selected = phrases.slice(0, 8);
            const targetWords = selected.map(p => ({ target: p[state.targetLang] || p.se, id: p.id }));
            const shuffled = [...targetWords].sort(() => Math.random() - 0.5);
            let html = `<div class="exercise-container"><div class="pairing-container">
                <div class="pairing-column"><h3>${DATA.ui[state.uiLang].selectTargetLanguage}</h3>
                ${targetWords.map((w, i) => `<div class="pair-item" onclick="selectPair('left', ${i})" id="left-${i}">${w.target}</div>`).join('')}
                </div><div class="pairing-column"><h3>${DATA.ui[state.uiLang].selectNativeLanguage}</h3>
                ${shuffled.map((w, i) => `<div class="pair-item" onclick="selectPair('right', ${i})" id="right-${i}">${w.target}</div>`).join('')}
                </div></div><button class="check-button" onclick="checkPairing()">${DATA.ui[state.uiLang].checkAnswer}</button>
                <div id="pairing-result"></div></div>`;
            document.getElementById('exercise-content').innerHTML = html;
            state.pairingData = { left: targetWords, right: shuffled };
        }

        function selectPair(side, index) {
            if (state.pairingSelected[side] !== null) {
                document.getElementById(`${side}-${state.pairingSelected[side]}`).classList.remove('selected');
            }
            state.pairingSelected[side] = index;
            document.getElementById(`${side}-${index}`).classList.add('selected');
            if (state.pairingSelected.left !== null && state.pairingSelected.right !== null) {
                const leftWord = state.pairingData.left[state.pairingSelected.left];
                const rightWord = state.pairingData.right[state.pairingSelected.right];
                if (leftWord.id === rightWord.id) {
                    document.getElementById(`left-${state.pairingSelected.left}`).classList.add('correct');
                    document.getElementById(`right-${state.pairingSelected.right}`).classList.add('correct');
                    state.pairingCorrect.push({ left: state.pairingSelected.left, right: state.pairingSelected.right });
                    state.pairingSelected = { left: null, right: null };
                }
            }
        }

        function checkPairing() {
            const total = state.pairingData.left.length;
            const correct = state.pairingCorrect.length;
            const resultDiv = document.getElementById('pairing-result');
            if (correct === total) {
                resultDiv.innerHTML = `<div class="result-message correct">✅ ${DATA.ui[state.uiLang].correct}</div>`;
            } else {
                resultDiv.innerHTML = `<div class="result-message incorrect">${correct}/${total} correct. ${DATA.ui[state.uiLang].tryAgain}!</div>`;
            }
        }

        function renderExercise3(phrases) {
            let html = '<div class="exercise-container">';
            phrases.slice(0, 5).forEach((phrase, idx) => {
                const text = phrase[state.targetLang] || phrase.se || '';
                if (!text) return;
                const words = text.split(' ');
                if (words.length < 3) return;
                const blankIndex = Math.floor(Math.random() * words.length);
                const blankWord = words[blankIndex];
                let sentenceHTML = words.map((word, i) => {
                    if (i === blankIndex) return `<input type="text" class="blank-input" id="blank-${idx}" data-answer="${word.toLowerCase()}" />`;
                    return word;
                }).join(' ');
                html += `<div class="fillblank-container"><div class="fillblank-sentence">${sentenceHTML}</div>
                    <p style="text-align: center; color: #666; margin-top: 10px;">Hint: <strong>${blankWord}</strong></p></div>`;
            });
            html += `<button class="check-button" onclick="checkFillBlanks()">${DATA.ui[state.uiLang].checkAnswer}</button>
                <div id="fillblank-result"></div></div>`;
            document.getElementById('exercise-content').innerHTML = html;
        }

        function checkFillBlanks() {
            const inputs = document.querySelectorAll('.blank-input');
            let correct = 0;
            inputs.forEach(input => {
                const answer = input.dataset.answer.toLowerCase().replace(/[.,!?]/g, '');
                const userAnswer = input.value.trim().toLowerCase().replace(/[.,!?]/g, '');
                if (userAnswer === answer) {
                    input.style.background = '#d4edda';
                    input.style.color = '#155724';
                    correct++;
                } else {
                    input.style.background = '#f8d7da';
                    input.style.color = '#721c24';
                }
            });
            const resultDiv = document.getElementById('fillblank-result');
            const ui = DATA.ui[state.uiLang];
            if (correct === inputs.length) {
                resultDiv.innerHTML = `<div class="result-message correct">✅ ${ui.correct}</div>`;
            } else {
                resultDiv.innerHTML = `<div class="result-message incorrect">${correct}/${inputs.length} correct. ${ui.tryAgain}!</div>`;
            }
        }

        function playAudio(filename) {
            const audioPath = `/audio/${state.industry}/${state.level}/${filename}_${state.targetLang}.mp3`;
            console.log('🔊 Playing:', audioPath);
            const audio = new Audio(audioPath);
            audio.play().catch(() => alert('Audio not available yet.'));
        }

        console.log('✅ WORKLINGO loaded - 444 phrases across 5 industries');
    </script>
</body>
</html>
