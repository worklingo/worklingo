        let selectedNative = '';
        let selectedTarget = '';
        let selectedCourse = '';
        let selectedLevel = '';
        let currentExerciseData = {};

        function init() {
            populateLanguages();
            setupEventListeners();
        }

        function populateLanguages() {
            const nativeLanguages = ['Slovak', 'Czech', 'Ukrainian', 'Russian', 'Polish', 'Bulgarian', 'Serbian', 'Romanian', 'Lithuanian'];
            const targetLanguages = ['Swedish', 'Norwegian', 'Danish', 'German', 'Dutch', 'English'];

            const nativeContainer = document.getElementById('nativeLanguages');
            nativeLanguages.forEach(lang => {
                const btn = document.createElement('button');
                btn.className = 'lang-btn';
                btn.textContent = lang;
                btn.onclick = () => selectNativeLanguage(lang);
                nativeContainer.appendChild(btn);
            });

            const targetContainer = document.getElementById('targetLanguages');
            targetLanguages.forEach(lang => {
                const btn = document.createElement('button');
                btn.className = 'lang-btn';
                btn.textContent = lang;
                btn.onclick = () => selectTargetLanguage(lang);
                targetContainer.appendChild(btn);
            });
        }

        function selectNativeLanguage(lang) {
            selectedNative = lang;
            document.querySelectorAll('#nativeLanguages .lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === lang);
            });
            // Go to step 2
            setTimeout(() => {
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
            }, 300);
        }

        function selectTargetLanguage(lang) {
            selectedTarget = lang;
            document.querySelectorAll('#targetLanguages .lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent === lang);
            });
            updateCourses();
            // Go to step 3
            setTimeout(() => {
                document.getElementById('step2').classList.remove('active');
                document.getElementById('step3').classList.add('active');
            }, 300);
        }

        function updateCourses() {
            const courseSelect = document.getElementById('courseSelect');
            courseSelect.innerHTML = '<option value="">Select industry...</option>';

            if (selectedTarget && database[selectedTarget]) {
                Object.keys(database[selectedTarget]).forEach(course => {
                    const option = document.createElement('option');
                    option.value = course;
                    option.textContent = course;
                    courseSelect.appendChild(option);
                });
            }
        }

        function setupEventListeners() {
            document.getElementById('courseSelect').addEventListener('change', (e) => {
                selectedCourse = e.target.value;
                if (selectedCourse) {
                    showLessons();
                    // Go to step 4
                    setTimeout(() => {
                        document.getElementById('step3').classList.remove('active');
                        document.getElementById('step4').classList.add('active');
                    }, 300);
                }
            });
        }

        function showLessons() {
            const lessonGrid = document.getElementById('lessonGrid');
            lessonGrid.innerHTML = '';

            if (database[selectedTarget] && database[selectedTarget][selectedCourse]) {
                const levels = Object.keys(database[selectedTarget][selectedCourse]);
                levels.forEach(level => {
                    const card = document.createElement('div');
                    card.className = 'lesson-card';
                    card.innerHTML = `
                        <h4>${level}</h4>
                        <p>Click to start learning</p>
                    `;
                    card.onclick = () => selectLesson(level);
                    lessonGrid.appendChild(card);
                });
            }
        }

        function selectLesson(level) {
            selectedLevel = level;
            document.querySelectorAll('.lesson-card').forEach(card => {
                card.classList.toggle('active', card.querySelector('h4').textContent === level);
            });
            displayPhrases();
            setupExercises();
            // Go to step 5
            setTimeout(() => {
                document.getElementById('step4').classList.remove('active');
                document.getElementById('step5').classList.add('active');
            }, 300);
        }

        function displayPhrases() {
            const phraseDisplay = document.getElementById('phraseDisplay');
            phraseDisplay.innerHTML = '<h2>📖 Phrases</h2>';

            const phrases = database[selectedTarget][selectedCourse][selectedLevel];
            phrases.forEach(phrase => {
                const item = document.createElement('div');
                item.className = 'phrase-item';
                item.innerHTML = `
                    <div class="target">${phrase.target}</div>
                    <div class="translation">${phrase.native[selectedNative]}</div>
                `;
                phraseDisplay.appendChild(item);
            });
        }

        function setupExercises() {
            const phrases = database[selectedTarget][selectedCourse][selectedLevel];
            currentExerciseData = {
                exercise1: null,
                exercise2: [],
                exercise3: null
            };

            renderExercise1(phrases);
            renderExercise2(phrases);
            renderExercise3(phrases);
        }

        function renderExercise1(phrases) {
            const ex1 = document.getElementById('exercise1');
            const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
            currentExerciseData.exercise1 = randomPhrase;

            const options = [randomPhrase.target];
            while (options.length < 4) {
                const random = phrases[Math.floor(Math.random() * phrases.length)].target;
                if (!options.includes(random)) options.push(random);
            }
            options.sort(() => Math.random() - 0.5);

            ex1.innerHTML = `
                <h3>Exercise 1: Choose correct translation</h3>
                <div class="exercise-item">
                    <p><strong>${randomPhrase.native[selectedNative]}</strong></p>
                    <div class="exercise-buttons">
                        ${options.map(opt => `<button class="exercise-btn" onclick="checkExercise1('${opt}')">${opt}</button>`).join('')}
                    </div>
                    <div id="feedback1"></div>
                </div>
            `;
        }

        function renderExercise2(phrases) {
            const ex2 = document.getElementById('exercise2');
            const selectedPhrases = phrases.slice(0, 4);
            currentExerciseData.exercise2 = selectedPhrases.map(p => ({ target: p.target, native: p.native[selectedNative] }));

            const leftWords = selectedPhrases.map(p => p.native[selectedNative]).sort(() => Math.random() - 0.5);
            const rightWords = selectedPhrases.map(p => p.target).sort(() => Math.random() - 0.5);

            ex2.innerHTML = `
                <h3>Exercise 2: Match the pairs</h3>
                <div class="word-pair-container">
                    <div class="word-column" id="leftColumn">
                        ${leftWords.map((word, i) => `<button class="word-btn" data-word="${word}" onclick="selectWord(this, 'left')">${word}</button>`).join('')}
                    </div>
                    <div class="word-column" id="rightColumn">
                        ${rightWords.map((word, i) => `<button class="word-btn" data-word="${word}" onclick="selectWord(this, 'right')">${word}</button>`).join('')}
                    </div>
                </div>
                <div id="feedback2"></div>
            `;
        }

        function renderExercise3(phrases) {
            const ex3 = document.getElementById('exercise3');
            const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
            currentExerciseData.exercise3 = randomPhrase;

            const words = randomPhrase.target.split(' ');
            const blankIndex = Math.floor(Math.random() * words.length);
            const correctWord = words[blankIndex];
            const sentenceWithBlank = words.map((w, i) => i === blankIndex ? '______' : w).join(' ');

            ex3.innerHTML = `
                <h3>Exercise 3: Fill in the blank</h3>
                <div class="exercise-item">
                    <p><strong>${sentenceWithBlank}</strong></p>
                    <p style="color: #6c757d; margin: 10px 0;">Hint: ${randomPhrase.native[selectedNative]}</p>
                    <input type="text" id="fillBlankInput" placeholder="Type the missing word...">
                    <button class="check-btn" onclick="checkExercise3('${correctWord}')">Check Answer</button>
                    <div id="feedback3"></div>
                </div>
            `;
        }

        function checkExercise1(selected) {
            const correct = currentExerciseData.exercise1.target;
            const buttons = document.querySelectorAll('#exercise1 .exercise-btn');
            const feedback = document.getElementById('feedback1');

            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === correct) {
                    btn.classList.add('correct');
                } else if (btn.textContent === selected && selected !== correct) {
                    btn.classList.add('incorrect');
                }
            });

            if (selected === correct) {
                feedback.className = 'feedback correct';
                feedback.textContent = '✅ Correct! Well done!';
            } else {
                feedback.className = 'feedback incorrect';
                feedback.textContent = `❌ Incorrect. The correct answer is: ${correct}`;
            }
        }

        let selectedLeft = null;
        let selectedRight = null;

        function selectWord(button, side) {
            if (button.classList.contains('matched')) return;

            const column = side === 'left' ? 'selectedLeft' : 'selectedRight';
            
            if (side === 'left') {
                if (selectedLeft) selectedLeft.classList.remove('selected');
                selectedLeft = button;
                button.classList.add('selected');
            } else {
                if (selectedRight) selectedRight.classList.remove('selected');
                selectedRight = button;
                button.classList.add('selected');
            }

            if (selectedLeft && selectedRight) {
                checkPair();
            }
        }

        function checkPair() {
            const leftWord = selectedLeft.dataset.word;
            const rightWord = selectedRight.dataset.word;

            const isMatch = currentExerciseData.exercise2.some(pair => 
                pair.target === leftWord && pair.native === rightWord
            );

            if (isMatch) {
                selectedLeft.classList.add('matched');
                selectedRight.classList.add('matched');
                selectedLeft.classList.remove('selected');
                selectedRight.classList.remove('selected');
                
                const feedback = document.getElementById('feedback2');
                feedback.className = 'feedback correct';
                feedback.textContent = '✅ Correct match!';
                setTimeout(() => feedback.textContent = '', 1500);
            } else {
                const feedback = document.getElementById('feedback2');
                feedback.className = 'feedback incorrect';
                feedback.textContent = '❌ Not a match. Try again!';
                setTimeout(() => {
                    selectedLeft.classList.remove('selected');
                    selectedRight.classList.remove('selected');
                    feedback.textContent = '';
                }, 1500);
            }

            selectedLeft = null;
            selectedRight = null;
        }

        function checkExercise3(correctWord) {
            const input = document.getElementById('fillBlankInput');
            const userAnswer = input.value.trim().toLowerCase();
            const correct = correctWord.toLowerCase();
            const feedback = document.getElementById('feedback3');

            if (userAnswer === correct) {
                feedback.className = 'feedback correct';
                feedback.textContent = '✅ Correct! Excellent!';
                input.disabled = true;
            } else {
                feedback.className = 'feedback incorrect';
                feedback.textContent = `❌ Incorrect. The correct answer is: ${correctWord}`;
            }
        }

        window.onload = init;
    </script>
